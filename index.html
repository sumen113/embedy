
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daymap</title>

    <!-- Use the Render website's favicon -->
    <link rel="icon" href="https://daymapsss-xsm4.onrender.com/favicon.ico" type="image/x-icon">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #website {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loader {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }

        #loading-message {
            margin-top: 18px;
            padding: 0 20px;
            color: #8db99a;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-align: center;
        }

        .fallback-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid #173323;
            border-top-color: #285c3c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #loading-screen {
                transition: none;
            }

            .fallback-spinner {
                animation-duration: 2s;
            }
        }
    </style>

        <script type="module">
        const LOADER_NAMES = [
            "Atom", "Commet", "FourSquare", "OrbitProgress", "Riple",
            "ThreeDot", "TrophySpin", "Mosaic", "Slab", "BlinkBlur", "Pulse"
        ];

        try {
            const [React, { createRoot }, Indicators] = await Promise.all([
                import("react"),
                import("react-dom/client"),
                import("https://esm.sh/react-loading-indicators@1.0.1?external=react")
            ]);

            // Only use loaders that actually exist in the installed version
            const available = LOADER_NAMES.filter(name => Indicators[name]);
            const pick = available[Math.floor(Math.random() * available.length)];
            const Loader = Indicators[pick];

            const root = createRoot(document.getElementById("loader"));

            root.render(
                React.createElement(Loader, {
                    color: "#285c3c",
                    size: "large",
                    text: false
                })
            );

            window.loaderReady = true;
            window.finishLoading();

        } catch (error) {
            console.error("Loading indicator failed:", error);

            document.getElementById("loader").innerHTML =
                '<div class="fallback-spinner"></div>';

            window.loaderReady = true;
            window.finishLoading();
        }
    </script>
</head>

<body>

    <iframe
        id="website"
        src="https://daymapsss-xsm4.onrender.com/"
        title="Daymap"
    ></iframe>

    <div id="loading-screen">
        <div id="loader"></div>
        <p id="loading-message"></p>
    </div>

        <script>
        const messages = [
            "pls share my website",
            "dont snitch",
            "make an acount, stupid",
            "100% daymap",
            "defitely not a game",
            "who would play games in class?",
            "whole game made in class",
            "1050 total viewes",
            "200+ accounts",
            "you can play this with friends(you dont have any)",
            "miss lawson reviewed",
            "please don't sweat",
            "your paying me 5 cents per hour",
            "im betting 5 days before the game gets blocked",
            "school ain't blocking me(for now)"
        ];

        const message = messages[
            Math.floor(Math.random() * messages.length)
        ];

        document.getElementById("loading-message").textContent = message;

        const EXTRA_LOAD_MS = 3000; // extra time the loader stays up after the site loads

        window.frameLoaded = false;
        window.loaderReady = false;
        window.finishStarted = false;

        window.finishLoading = function () {
            if (!window.frameLoaded || !window.loaderReady) return;
            if (window.finishStarted) return;
            window.finishStarted = true;

            setTimeout(() => {
                const screen = document.getElementById("loading-screen");
                screen.classList.add("hidden");

                screen.addEventListener("transitionend", () => {
                    screen.remove();
                }, { once: true });
            }, EXTRA_LOAD_MS);
        };

        document.getElementById("website").addEventListener("load", () => {
            window.frameLoaded = true;
            window.finishLoading();
        }, { once: true });
    </script>

</body>
</html>
