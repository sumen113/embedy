
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daymap</title>

    <!-- Use the Render website's favicon -->
    <link rel="icon" href="https://daymapss-jysh.onrender.com/favicon.ico" type="image/x-icon">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #website {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loader {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }

        #loading-message {
            margin-top: 18px;
            padding: 0 20px;
            color: #8db99a;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-align: center;
        }

        .fallback-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid #173323;
            border-top-color: #285c3c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #loading-screen {
                transition: none;
            }

            .fallback-spinner {
                animation-duration: 2s;
            }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
        }
    }
    </script>
</head>

<body>

    <iframe
        id="website"
        src="https://daymapss-jysh.onrender.com"
        title="Daymap"
    ></iframe>

    <div id="loading-screen">
        <div id="loader"></div>
        <p id="loading-message"></p>
    </div>

    <script>
        const messages = [
            "pls share my website",
            "dont snitch",
            "make an acount, stupid",
            "100% daymap",
            "defitely not a game",
            "who would play games in class?",
            "whole game made in class",
            "1050 total viewes",
            "200+ accounts",
            "you can play this with friends(you dont have any)",
            "miss lawson reviewed",
            "please don't sweat",
            "your paying me 5 cents per hour",
            "im betting 5 days before the game gets blocked",
            "school ain't blocking me(for now)"
        ];

        const message = messages[
            Math.floor(Math.random() * messages.length)
        ];

        document.getElementById("loading-message").textContent = message;

        window.frameLoaded = false;
        window.loaderReady = false;

        window.finishLoading = function () {
            if (!window.frameLoaded || !window.loaderReady) return;

            const screen = document.getElementById("loading-screen");
            screen.classList.add("hidden");

            screen.addEventListener("transitionend", () => {
                screen.remove();
            }, { once: true });
        };

        document.getElementById("website").addEventListener("load", () => {
            window.frameLoaded = true;
            window.finishLoading();
        }, { once: true });
    </script>

    <script type="module">
        import React from "react";
        import { createRoot } from "react-dom/client";
        import { Atom } from "https://esm.sh/react-loading-indicators@1.0.1?external=react";

        try {
            const root = createRoot(document.getElementById("loader"));

            root.render(
                React.createElement(Atom, {
                    color: "#285c3c",
                    size: "large",
                    text: false
                })
            );

            window.loaderReady = true;
            window.finishLoading();

        } catch (error) {
            console.error("Loading indicator failed:", error);

            document.getElementById("loader").innerHTML =
                '<div class="fallback-spinner"></div>';

            window.loaderReady = true;
            window.finishLoading();
        }
    </script>

</body>
</html>
